name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Testar o motor de lembrete
        run: npm test
      - name: Compilar
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
